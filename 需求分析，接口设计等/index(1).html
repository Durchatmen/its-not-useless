<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧医疗AI辅助系统 - PC端</title>
<script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>
<script>window.Vue || document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"><\/script>')</script>
<style>
  :root{
    --primary:#0e9f8f; --primary-dark:#0b8074; --primary-light:#e3f6f3;
    --blue:#3b82f6; --orange:#f59e0b; --red:#ef4444; --purple:#8b5cf6;
    --text:#1f2937; --text-2:#6b7280; --text-3:#9ca3af;
    --bg:#eef2f5; --card:#ffffff; --line:#e4eaee;
    --shadow:0 2px 12px rgba(16,60,54,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text)}
  #app{min-height:100vh;display:flex;flex-direction:column}

  /* ================= 顶部导航条 ================= */
  .navbar{height:62px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 40px;gap:28px;position:sticky;top:0;z-index:60}
  .navbar .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
  .navbar .logo .lg-ico{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#12b5a2);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
  .navbar .logo b{font-size:17px;letter-spacing:.5px}
  .navbar .nav-links{display:flex;gap:6px;flex:1}
  .navbar .nav-link{padding:8px 18px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--text-2)}
  .navbar .nav-link:hover{background:var(--primary-light);color:var(--primary)}
  .navbar .nav-link.active{background:var(--primary-light);color:var(--primary);font-weight:700}
  .navbar .right{display:flex;align-items:center;gap:14px}
  .btn-login{padding:8px 26px;border-radius:8px;border:1.5px solid var(--primary);color:var(--primary);
    background:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
  .btn-login:hover{background:var(--primary);color:#fff}
  .btn-reg{padding:8px 26px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--primary),#12b5a2);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  .user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600}
  .user-chip .u-ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#12b5a2,#3b82f6);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}

  /* ================= 首页（PC 宽屏） ================= */
  .home-main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:34px 40px 130px}
  .home-hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,var(--primary),#12b5a2 55%,#3b82f6);
    border-radius:18px;color:#fff;padding:30px 40px;margin-bottom:30px;position:relative;overflow:hidden}
  .home-hero h2{font-size:24px;margin-bottom:8px}
  .home-hero p{font-size:14px;opacity:.92;line-height:1.7}
  .home-hero .hero-btn{background:#fff;color:var(--primary);font-weight:700;font-size:14px;padding:10px 26px;
    border-radius:22px;cursor:pointer;border:none;margin-top:14px}
  .home-hero .deco{position:absolute;right:-40px;top:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
  .home-hero .deco2{position:absolute;right:120px;top:60px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.12)}
  .home-hero .h-ava{font-size:64px;position:relative;z-index:1}

  .panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:26px}
  .panel-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
  .panel-title h3{font-size:18px;border-left:4px solid var(--primary);padding-left:12px}
  .panel-title span{font-size:12px;color:var(--text-3)}

  /* 功能宫格：3 列，对应原型图布局 */
  .func-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .func-item{border:1.5px solid var(--line);border-radius:14px;padding:26px 20px;display:flex;align-items:center;
    gap:16px;cursor:pointer;transition:.2s;background:#fff}
  .func-item:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(14,159,143,.15);transform:translateY(-3px)}
  .func-item .fi-ico{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:26px;flex-shrink:0}
  .func-item b{font-size:17px;display:block}
  .func-item p{font-size:12px;color:var(--text-2);margin-top:5px;line-height:1.6}

  /* 健康资讯 */
  .news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .news-card{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
  .news-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-3px)}
  .news-card .n-top{height:110px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
  .news-card .n-body{padding:14px 16px}
  .news-card h4{font-size:14px;line-height:1.6}
  .news-card p{font-size:11px;color:var(--text-3);margin-top:8px}

  /* ================= 底部圆形导航（对应原型图：首页 / AI陪诊小助手 / 我的） ================= */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:96px;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:center;align-items:flex-start;gap:120px;z-index:50;padding-top:0}
  .bn-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;margin-top:-16px}
  .bn-item .bn-circle{width:62px;height:62px;border-radius:50%;background:#fff;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:24px;transition:.2s;box-shadow:var(--shadow)}
  .bn-item span{font-size:12px;color:var(--text-2);margin-top:6px}
  .bn-item:hover .bn-circle{border-color:var(--primary);color:var(--primary)}
  .bn-item.active .bn-circle{background:linear-gradient(135deg,var(--primary),#12b5a2);border-color:transparent;color:#fff}
  .bn-item.active span{color:var(--primary);font-weight:700}
  .bn-center .bn-circle{width:76px;height:76px;background:linear-gradient(135deg,#12b5a2,#3b82f6);
    border:3px solid #fff;color:#fff;font-size:13px;font-weight:700;flex-direction:column;line-height:1.3;
    box-shadow:0 8px 20px rgba(18,181,162,.45);gap:0}
  .bn-center .bn-circle .bc-ico{font-size:20px;line-height:1}
  .bn-center:hover .bn-circle{transform:scale(1.06)}
  .bn-center span{font-weight:600;color:var(--text)}

  /* ================= 登录 / 注册（PC 居中卡片，对应原型图） ================= */
  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0e9f8f 0%,#12b5a2 45%,#3b82f6 100%);padding:50px 20px;min-height:calc(100vh - 62px)}
  .auth-box{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);
    padding:44px 52px;width:440px}
  .auth-box.wide{width:480px}
  .auth-box h2{text-align:center;font-size:22px;margin-bottom:6px}
  .auth-box .sub{text-align:center;font-size:12px;color:var(--text-3);margin-bottom:28px}
  .field{margin-bottom:20px}
  .field label{font-size:13px;color:var(--text-2);display:block;margin-bottom:7px;font-weight:600}
  .input-wrap{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;
    padding:0 14px;height:46px;gap:10px;transition:border-color .2s;background:#fff}
  .input-wrap:focus-within{border-color:var(--primary)}
  .input-wrap .f-ico{font-size:15px;color:var(--text-3)}
  .input-wrap input,.input-wrap select{border:none;outline:none;flex:1;font-size:14px;
    background:transparent;color:var(--text);height:100%;appearance:none;font-family:inherit}
  .code-btn{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;white-space:nowrap;
    border:1px solid var(--primary);border-radius:6px;padding:5px 10px;margin-left:8px}
  .code-btn.disabled{color:var(--text-3);border-color:var(--line);cursor:not-allowed}
  .btn-main{width:100%;height:46px;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;
    background:linear-gradient(135deg,var(--primary),#12b5a2);cursor:pointer;letter-spacing:4px;
    box-shadow:0 4px 14px rgba(14,159,143,.35)}
  .btn-main:active{opacity:.85}
  .btn-ghost{width:100%;height:44px;border-radius:10px;border:1.5px solid var(--primary);
    color:var(--primary);background:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .link-row{display:flex;justify-content:flex-end;margin:-6px 0 18px;font-size:12px}
  .link-row a{color:var(--text-3);text-decoration:none;cursor:pointer}
  .link-row a:hover{color:var(--primary)}
  .btn-row{display:flex;gap:16px;margin-top:4px}
  .btn-row .btn-main{flex:1;letter-spacing:2px}
  .btn-row .btn-ghost{flex:1}
  .err-msg{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;font-size:12px;
    border-radius:8px;padding:9px 14px;margin-bottom:16px}
  .auth-tip{text-align:center;font-size:11px;color:var(--text-3);margin-top:22px;line-height:1.7}
  .switch-auth{text-align:center;margin-top:18px;font-size:13px;color:var(--text-2)}
  .switch-auth b{color:var(--primary);cursor:pointer}

  /* ================= AI 陪诊（PC 聊天页） ================= */
  .chat-page{flex:1;display:flex;justify-content:center;padding:26px 40px 120px}
  .chat-panel{width:100%;max-width:900px;background:#fff;border-radius:18px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:480px;overflow:hidden}
  .chat-head{background:linear-gradient(135deg,var(--primary),#12b5a2);color:#fff;padding:16px 24px;
    display:flex;align-items:center;gap:12px}
  .chat-head .bot-ava{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .chat-head h3{font-size:17px}
  .chat-head small{font-size:11px;opacity:.85;display:block}
  .chat-body{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;background:#f7fafb}
  .msg{display:flex;gap:10px;max-width:72%}
  .msg .m-ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:18px;background:#fff;box-shadow:var(--shadow)}
  .msg .bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:12px 16px;font-size:14px;
    line-height:1.8;box-shadow:var(--shadow)}
  .msg .bubble .cite{display:block;font-size:11px;color:var(--text-3);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .msg.user{flex-direction:row-reverse;align-self:flex-end}
  .msg.user .bubble{background:linear-gradient(135deg,var(--primary),#12b5a2);color:#fff;border-radius:14px 4px 14px 14px}
  .card-out{margin-top:10px;background:var(--primary-light);border-radius:10px;padding:12px 14px;font-size:13px}
  .card-out .go{display:inline-block;margin-top:8px;background:var(--primary);color:#fff;
    font-size:13px;padding:6px 18px;border-radius:16px;font-weight:600;cursor:pointer}
  .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text-3);
    margin-right:3px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .quick-qs{display:flex;gap:10px;padding:12px 28px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
  .quick-qs button{border:1px solid var(--primary);color:var(--primary);background:#fff;
    border-radius:16px;font-size:12px;padding:7px 16px;cursor:pointer}
  .quick-qs button:hover{background:var(--primary-light)}
  .chat-footer{display:flex;gap:12px;padding:16px 28px;border-top:1px solid var(--line);background:#fff}
  .chat-footer input{flex:1;height:44px;border:1.5px solid var(--line);border-radius:22px;padding:0 20px;
    font-size:14px;outline:none}
  .chat-footer input:focus{border-color:var(--primary)}
  .chat-footer .send{width:44px;height:44px;border-radius:50%;border:none;color:#fff;font-size:17px;
    background:linear-gradient(135deg,var(--primary),#12b5a2);cursor:pointer}

  /* ================= 我的（PC） ================= */
  .profile-main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:30px 40px 130px;display:flex;gap:26px;align-items:flex-start}
  .profile-side{width:300px;flex-shrink:0}
  .p-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:28px;text-align:center;margin-bottom:22px}
  .p-card .p-ava{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#12b5a2,#3b82f6);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
  .p-card h3{font-size:19px}
  .p-card p{font-size:12px;color:var(--text-2);margin-top:6px}
  .p-tag{display:inline-block;margin-top:10px;background:var(--primary-light);color:var(--primary);
    font-size:11px;padding:4px 14px;border-radius:12px;font-weight:600}
  .stat-list{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 0}
  .stat-list .sl{display:flex;justify-content:space-between;padding:14px 24px;font-size:14px;cursor:pointer}
  .stat-list .sl:hover{background:#f8fafa}
  .stat-list .sl b{color:var(--primary)}
  .cell-group{flex:1;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .cell{display:flex;align-items:center;padding:19px 26px;gap:16px;cursor:pointer;border-bottom:1px solid var(--line)}
  .cell:last-child{border-bottom:none}
  .cell:hover{background:#f8fafa}
  .cell .c-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
  .cell .c-main{flex:1;font-size:15px;font-weight:600}
  .cell .c-sub{font-size:12px;color:var(--text-3);font-weight:400;margin-top:3px}
  .cell .arrow{color:#c9d2d6;font-size:16px}

  /* ================= 功能详情（PC） ================= */
  .detail-main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:34px 40px 130px}
  .detail-head{display:flex;align-items:center;gap:20px;background:#fff;border-radius:18px;
    box-shadow:var(--shadow);padding:28px 34px;margin-bottom:24px}
  .detail-head .d-ico{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
  .detail-head h2{font-size:22px}
  .detail-head p{font-size:13px;color:var(--text-2);margin-top:6px}
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .feat-item{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;border-top:4px solid var(--primary)}
  .feat-item b{font-size:15px}
  .feat-item p{font-size:13px;color:var(--text-2);margin-top:9px;line-height:1.8}

  /* Toast */
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);
    color:#fff;padding:12px 26px;border-radius:10px;font-size:14px;z-index:99}
  .fade-enter-active,.fade-leave-active{transition:opacity .25s}
  .fade-enter-from,.fade-leave-to{opacity:0}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, nextTick } = Vue;

/* ---------------- 功能模块数据（来自设计文档 3.x 章节） ---------------- */
const MODULES = {
  triage:   { icon:'🩺', color:'#0e9f8f', bg:'#e3f6f3', name:'预诊 + 分诊', desc:'AI 智能预诊与精准分诊', cta:'开始 AI 预诊',
              feats:[
                {t:'症状自查', d:'输入或语音描述症状（如"头痛伴有恶心"），AI Agent 调用诊疗知识库进行初步分析。'},
                {t:'精准分诊', d:'根据预诊结果，结合科室及医生知识库，推荐最合适的科室（如神经内科）及擅长该症状的医生。'},
                {t:'生成初步病历', d:'预诊 Agent 自动整理主诉与病史，同步给接诊医生，节省问诊时间。'}]},
  register: { icon:'📅', color:'#3b82f6', bg:'#e8f1fe', name:'挂号', desc:'分时段预约，号源实时可查', cta:'去挂号',
              feats:[
                {t:'预约挂号', d:'展示医生排班表，支持分时段预约，锁定心仪医生。'},
                {t:'分诊推荐', d:'分诊 Agent 根据医生擅长和号源情况，智能推荐医生。'},
                {t:'候诊提醒', d:'挂号成功后推送候诊队列与预计叫号时间。'}]},

              feats:[
                {t:'检查指引', d:'推送检查科室位置（结合医院导航）及注意事项（如空腹、憋尿）。'},
                {t:'报告查询', d:'检查结果出来后实时推送，第一时间知晓。'},
                {t:'AI 报告解读', d:'将专业医学术语（如"双肺纹理增粗"）转化为通俗语言，并提示风险等级。'}]},
  record:   { icon:'📋', color:'#f59e0b', bg:'#fef4e2', name:'病历', desc:'电子病历结构化展示', cta:'查看病历',
              feats:[
                {t:'电子病历', d:'结构化展示医生的诊断结果、处方信息，随时回溯。'},
                {t:'病历解释', d:'病历解释 Agent 将专业表述转化为通俗易懂的语言。'},
                {t:'健康档案', d:'展示过敏史、既往病史、血型等基础信息。'}]},
  pay:      { icon:'💳', color:'#10b981', bg:'#e2f8ef', name:'支付', desc:'诊间结算，无需排队', cta:'去缴费',
              feats:[
                {t:'多渠道支付', d:'集成微信 / 支付宝 / 医保移动支付。'},
                {t:'诊间结算', d:'医生开单后可直接在线支付，无需排队缴费。'},
                {t:'费用明细', d:'每一笔费用清晰可查，支持医保报销比例预估。'}]},
  nav:      { icon:'🗺️', color:'#ef4444', bg:'#feecec', name:'医院导航', desc:'院外规划 + 院内实景导引', cta:'开始导航',
              feats:[
                {t:'院外路径规划', d:'调用高德地图 API，展示驾车 / 公交 / 步行多种方案与耗时对比。'},
                {t:'院内导航', d:'基于医院平面图，蓝牙 / WiFi 定位，绘制绿色引导线，支持楼层切换。'},
                {t:'智能推荐', d:'根据当天挂号信息自动推荐目的地科室，语音播报关键节点。'}]},
  med:      { icon:'💊', color:'#06b6d4', bg:'#e1f6fa', name:'用药提醒', desc:'按时服药，自动推送', cta:'查看用药计划',
              feats:[
                {t:'服药计划', d:'用药 Agent 根据处方自动生成服药计划（如"每日三次，饭后服用"）。'},
                {t:'推送提醒', d:'到点推送通知提醒患者服药，避免漏服。'},
                {t:'药品百科', d:'查询药品说明书、副作用及禁忌，用药 Agent 校验相互作用。'}]},
  insurance:{ icon:'🏥', color:'#6366f1', bg:'#eaecfe', name:'医保查询', desc:'报销比例与自付金额预估', cta:'查询医保',
              feats:[
                {t:'报销比例查询', d:'查询药品 / 诊疗项目的医保报销比例。'},
                {t:'自付金额预估', d:'结合最新医保目录，预估本次就诊自付金额。'},
                {t:'医保知识库', d:'AI 基于最新医保政策知识库回答，标注引用来源。'}]},

const NEWS = [
